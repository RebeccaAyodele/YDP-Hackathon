<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="repulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Rounded container matching Repulse badge styling -->
  <rect width="64" height="64" rx="16" fill="url(#repulseGrad)" filter="url(#shadow)"/>
  
  <!-- Pulse / Epidemiological Activity wave -->
  <path d="M 12 33 L 23 33 L 28 20 L 34 45 L 41 26 L 45 35 L 52 33" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Subtle accent dots for telemetry nodes -->
  <circle cx="28" cy="20" r="2.5" fill="#34D399"/>
  <circle cx="34" cy="45" r="2.5" fill="#34D399"/>
</svg>

